CONFIG_ZMK_KEYBOARD_NAME="ZK_ZMK_SCREEN"
CONFIG_ZMK_SETTINGS_RESET_ON_START=n
CONFIG_ZMK_SPLIT=y

# Uncomment the following line to increase the keyboard's wireless range
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Enable eager debouncing
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=7

# Enable batterie report 
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y

# Enable the screen 
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_INVERT=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y
CONFIG_ZMK_WIDGET_WPM_STATUS=n

# Augmente le nombre maximum de combos actifs simultanément (défaut: 4)
CONFIG_ZMK_COMBO_MAX_PRESSED_COMBOS=8

# Active le support NKRO pour une meilleure détection multi-touches
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y

# ===== PERFORMANCE OPTIMIZATIONS =====
# Optimise les performances pour les combos complexes
CONFIG_ZMK_KSCAN_COMPOSITE_DRIVER=y
